<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

<div class="admin-page" id="adminPage">
  <div class="admin-header">
    <h1>Admin Dashboard</h1>
    <div id="adminUserPanel" class="admin-user-panel"></div>
  </div>

  <div id="adminUnauthorized" class="admin-alert hidden">
    <strong>Access denied.</strong> This page is for admin users only.
  </div>

  <div id="adminContent" class="admin-content hidden">
    <section class="admin-card">
      <div class="admin-card-head">
        <h2>Notification Center</h2>
        <div class="admin-filter-wrap">
          <span id="adminUnreadBadge" class="admin-badge">0 unread</span>
          <button id="markAllAdminNotificationsBtn" type="button">Mark all read</button>
        </div>
      </div>
      <div id="adminNotificationsList" class="admin-list"></div>
    </section>

    <section class="admin-card">
      <div class="admin-card-head">
        <h2>Dashboard Metrics</h2>
        <span class="admin-badge">Live</span>
      </div>
      <div id="adminMetrics" class="admin-metrics"></div>
    </section>

    <section class="admin-card">
      <div class="admin-card-head">
        <h2>Products</h2>
        <span class="admin-badge">Realtime</span>
      </div>

      <form id="productForm" class="admin-form" autocomplete="off">
        <input id="productIdInput" type="number" min="1" placeholder="Product ID" required>
        <input id="productNameInput" type="text" placeholder="Name" required>
        <input id="productSizeInput" type="text" placeholder="Size" required>
        <input id="productPriceInput" type="number" min="0" step="0.01" placeholder="Price" required>
        <input id="productImageInput" type="text" placeholder="Image URL or file name" required>
        <input id="productStockInput" type="number" min="0" step="1" placeholder="Stock" required>
        <input id="productCategoryInput" type="text" placeholder="Category (e.g. Apparel)">
        <input id="productTagsInput" type="text" placeholder="Tags (comma separated)">

        <div class="admin-form-actions">
          <button id="saveProductBtn" type="submit">Save Product</button>
          <button id="clearProductBtn" type="button">Clear</button>
        </div>
      </form>

      <div class="admin-tools-row">
        <input id="adminProductSearch" type="text" placeholder="Search product by name, id, or size">
        <select id="adminStockFilter">
          <option value="all">All stock</option>
          <option value="low">Low stock</option>
          <option value="out">Out of stock</option>
        </select>
      </div>
      <div class="admin-tools-row">
        <select id="adminCategoryFilter">
          <option value="all">All categories</option>
        </select>
        <input id="adminTagFilter" type="text" placeholder="Filter by tag">
      </div>
      <div class="admin-tools-row">
        <input id="adminMinPriceFilter" type="number" min="0" step="1" placeholder="Min price">
        <input id="adminMaxPriceFilter" type="number" min="0" step="1" placeholder="Max price">
      </div>
      <div class="admin-tools-row">
        <input id="adminLowStockThresholdInput" type="number" min="1" step="1" placeholder="Low-stock threshold">
        <button id="saveLowStockThresholdBtn" type="button">Save threshold</button>
      </div>
      <div id="adminTagChips" class="tag-chip-wrap"></div>

      <div class="admin-backup-row">
        <button id="exportProductsJsonBtn" type="button">Export Products JSON</button>
        <label class="file-import-btn" for="importProductsJsonInput">Import Products JSON</label>
        <input id="importProductsJsonInput" type="file" accept=".json,application/json" class="hidden">
      </div>

      <div id="productLinkResult" class="admin-link-result hidden">
        <label for="productLinkInput">Generated checkout URL</label>
        <div class="admin-link-row">
          <input id="productLinkInput" type="text" readonly>
          <button id="copyProductLinkBtn" type="button">Copy</button>
          <a id="openProductLinkBtn" href="#" target="_blank" rel="noopener noreferrer">Open</a>
        </div>
      </div>

      <div id="adminProductsList" class="admin-list"></div>
    </section>

    <section class="admin-card">
      <div class="admin-card-head">
        <h2>Orders</h2>
        <div class="admin-filter-wrap">
          <label for="adminStatusFilter">Filter</label>
          <select id="adminStatusFilter">
            <option value="all">All</option>
            <option value="pending">Pending</option>
            <option value="in_transit">In Transit</option>
            <option value="delivered">Delivered</option>
            <option value="canceled">Canceled</option>
          </select>
          <button id="exportOrdersCsvBtn" type="button">Export CSV</button>
        </div>
      </div>

      <div id="adminOrdersList" class="admin-list"></div>
      <div id="adminOrdersPagination" class="list-pagination"></div>
    </section>

    <section class="admin-card">
      <div class="admin-card-head">
        <h2>Audit Log</h2>
        <span class="admin-badge">Status Changes</span>
      </div>
      <div id="adminAuditLog" class="admin-list"></div>
    </section>

    <section class="admin-card">
      <div class="admin-card-head">
        <h2>Analytics</h2>
        <button id="exportDailySalesCsvBtn" type="button">Export Daily Sales CSV</button>
      </div>
      <div id="adminTopProducts" class="admin-list"></div>
      <div id="adminConversionFunnel" class="admin-list"></div>
      <div id="adminDailySalesChart" class="admin-list"></div>
    </section>

    <section class="admin-card">
      <div class="admin-card-head">
        <h2>Return Requests</h2>
        <span class="admin-badge">Mock Flow</span>
      </div>
      <div id="adminReturnRequests" class="admin-list"></div>
    </section>
  </div>
</div>

<div id="returnRequestModal" class="return-modal hidden" role="dialog" aria-modal="true" aria-labelledby="returnModalTitle">
  <div class="return-modal-card">
    <div class="return-modal-head">
      <h3 id="returnModalTitle">Return Request Details</h3>
      <button id="returnModalCloseBtn" type="button" aria-label="Close return request details">Close</button>
    </div>
    <div id="returnModalBody" class="return-modal-body"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth-service.js"></script>
<script src="firebase-auth-helpers.js"></script>
<script src="firebase-db.js"></script>
<script src="admin.js"></script>
</body>
</html>
