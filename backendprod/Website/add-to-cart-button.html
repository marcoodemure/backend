<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add To Cart Button</title>
<style>
  :root {
    --btn-bg: #111111;
    --btn-color: #ffffff;
    --btn-ok-bg: #e9f9ef;
    --btn-ok-color: #0f8a3c;
    --btn-ok-border: #16a34a;
    --btn-err-bg: #fee2e2;
    --btn-err-color: #b91c1c;
    --btn-err-border: #ef4444;
    --text-muted: #475569;
    --ok: #0f8a3c;
    --err: #b91c1c;
    --info: #1d4ed8;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    font-family: "Inter", Arial, sans-serif;
    width: 100%;
    min-height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(6px, 1.8vw, 14px);
    box-sizing: border-box;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: min(100%, 460px);
    padding: 6px;
    box-sizing: border-box;
  }
  body.compact .wrap {
    gap: 0;
    padding: 0;
    width: 100%;
  }
  #addToCartBtn {
    border: 1px solid #111111;
    border-radius: 12px;
    background: var(--btn-bg);
    color: var(--btn-color);
    font-weight: 800;
    font-size: clamp(14px, 1.8vw, 16px);
    padding: clamp(10px, 1.9vw, 14px) clamp(12px, 2.4vw, 16px);
    cursor: pointer;
    line-height: 1.2;
    min-height: 44px;
    width: 100%;
    box-sizing: border-box;
  }
  #addToCartBtn.with-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  #addToCartBtn.is-added {
    background: var(--btn-ok-bg);
    border-color: var(--btn-ok-border);
    color: var(--btn-ok-color);
  }
  #addToCartBtn.is-error {
    background: var(--btn-err-bg);
    border-color: var(--btn-err-border);
    color: var(--btn-err-color);
  }
  #addToCartBtn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
  }
  #addToCartMessage {
    font-size: clamp(12px, 1.5vw, 13px);
    line-height: 1.4;
    min-height: 18px;
    color: var(--text-muted);
    word-break: break-word;
  }
  #addToCartMessage.ok {
    color: var(--ok);
  }
  #addToCartMessage.err {
    color: var(--err);
  }
  #addToCartMessage.info {
    color: var(--info);
  }
  body.compact #addToCartMessage {
    display: none;
  }
  @media (max-width: 900px) {
    .wrap {
      width: min(100%, 560px);
    }
  }
  @media (max-width: 640px) {
    body {
      align-items: flex-start;
      justify-content: center;
      padding: 10px;
    }
    .wrap {
      width: 100%;
      max-width: 100%;
      padding: 2px;
    }
    body.compact {
      padding: 0;
      align-items: stretch;
      justify-content: stretch;
    }
  }
</style>
</head>
<body>
  <div class="wrap">
    <button id="addToCartBtn" type="button">Add to cart</button>
    <div id="addToCartMessage" aria-live="polite"></div>
  </div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth-service.js"></script>
<script src="firebase-auth-helpers.js"></script>
<script src="firebase-db.js"></script>
<script>
(function () {
  const notLoggedInRedirectUrl = "https://sites.google.com/view/habitlikha/home/profile";
  const params = new URLSearchParams(window.location.search);
  const auth = window.authService;
  const appDb = window.appDb;
  const button = document.getElementById("addToCartBtn");
  const message = document.getElementById("addToCartMessage");
  const isCompact = params.get("compact") === "1";
  const autoRetryEnabled = params.get("auto_retry") === "1" || params.get("retry") === "1";
  const retryMax = toBoundedInt(params.get("retry_max"), 2, 0, 5);
  const retryDelayMs = toBoundedInt(params.get("retry_delay_ms"), 900, 200, 15000);
  let restoreTimer = null;
  if (isCompact) {
    document.body.classList.add("compact");
  }

  function toProductId(value) {
    const id = Number(value);
    return Number.isFinite(id) && id > 0 ? Math.floor(id) : 0;
  }

  function toQty(value) {
    const qty = Number(value);
    return Number.isFinite(qty) && qty > 0 ? Math.max(1, Math.floor(qty)) : 1;
  }

  function toBoundedInt(value, fallback, min, max) {
    const num = Number(value);
    if (!Number.isFinite(num)) {
      return fallback;
    }
    return Math.min(max, Math.max(min, Math.floor(num)));
  }

  function setMessage(text, type) {
    message.textContent = text || "";
    message.classList.remove("ok", "err", "info");
    if (type === "ok") message.classList.add("ok");
    if (type === "err") message.classList.add("err");
    if (type === "info") message.classList.add("info");
  }

  function parseHoldMs(value, fallbackMs) {
    const raw = Number(value);
    return Number.isFinite(raw)
      ? Math.max(800, Math.min(10000, Math.floor(raw)))
      : fallbackMs;
  }

  function classifyAddError(error, defaults) {
    const code = String(error?.code || "").toLowerCase();
    if (code === "product_not_found") {
      return {
        message: "Product not found.",
        buttonText: "Not found",
        redirect: false
      };
    }
    if (code === "product_inactive") {
      return {
        message: "Product is inactive right now.",
        buttonText: "Inactive",
        redirect: false
      };
    }
    if (code === "permission-denied") {
      return {
        message: "Permission denied for cart update.",
        buttonText: "Blocked",
        redirect: false
      };
    }
    if (code === "unauthenticated" || code === "auth/user-token-expired") {
      return {
        message: "Session expired. Please sign in again.",
        buttonText: "Sign in",
        redirect: true
      };
    }
    if (code === "cart_api_missing") {
      return {
        message: "Cart API is unavailable on this page.",
        buttonText: "Unavailable",
        redirect: false
      };
    }
    if (code === "failed-precondition" || code === "out_of_stock") {
      return {
        message: "Cannot add this item right now.",
        buttonText: "Try later",
        redirect: false
      };
    }
    return {
      message: defaults.message,
      buttonText: defaults.buttonText,
      redirect: false
    };
  }

  function isRetryableAddError(error) {
    const code = String(error?.code || "").toLowerCase();
    if (code === "unavailable" || code === "deadline-exceeded" || code === "aborted" || code === "internal" || code === "unknown" || code === "resource-exhausted" || code === "network-request-failed") {
      return true;
    }

    const text = String(error?.message || "").toLowerCase();
    return text.includes("timeout")
      || text.includes("network")
      || text.includes("failed to fetch")
      || text.includes("temporarily");
  }

  function wait(ms) {
    return new Promise((resolve) => {
      setTimeout(resolve, ms);
    });
  }

  async function runWithRetry(task, onRetry) {
    let retryCount = 0;
    while (true) {
      try {
        return await task();
      } catch (error) {
        if (!autoRetryEnabled || !isRetryableAddError(error) || retryCount >= retryMax) {
          throw error;
        }
        retryCount += 1;
        if (typeof onRetry === "function") {
          onRetry(retryCount, retryMax, error);
        }
        await wait(retryDelayMs * retryCount);
      }
    }
  }

  function setTimedButtonState(kind, text, previousLabel, holdMs) {
    if (restoreTimer) {
      clearTimeout(restoreTimer);
      restoreTimer = null;
    }
    button.classList.remove("is-added", "is-error");
    if (kind === "ok") button.classList.add("is-added");
    if (kind === "err") button.classList.add("is-error");
    button.textContent = text;
    restoreTimer = setTimeout(() => {
      button.classList.remove("is-added", "is-error");
      button.textContent = previousLabel || "Add to cart";
      restoreTimer = null;
    }, holdMs);
  }

  function saveLocalCart(productId, quantity) {
    try {
      localStorage.setItem("cartProductId", String(productId));
      localStorage.setItem("cartQuantity", String(Math.max(1, Number(quantity) || 1)));
    } catch {}
  }

  function getLiveFirebaseUser() {
    try {
      if (window.firebaseAuth?.currentUser?.uid) {
        return window.firebaseAuth.currentUser;
      }
      if (window.firebase && typeof window.firebase.auth === "function") {
        const authInstance = window.firebase.auth();
        if (authInstance?.currentUser?.uid) {
          return authInstance.currentUser;
        }
      }
    } catch {}
    return null;
  }

  function applyButtonOptions() {
    const label = String(params.get("label") || "").trim();
    const bg = String(params.get("bg") || "").trim();
    const color = String(params.get("color") || "").trim();
    if (label) {
      button.textContent = label;
    }
    if (/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(bg)) {
      document.documentElement.style.setProperty("--btn-bg", bg);
    }
    if (/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(color)) {
      document.documentElement.style.setProperty("--btn-color", color);
    }
  }

  async function resolveUser() {
    let user = null;
    if (auth && typeof auth.getCurrentUser === "function") {
      user = auth.getCurrentUser();
    }
    if (!user?.uid && auth && typeof auth.waitForAuthState === "function") {
      user = await auth.waitForAuthState(4500);
    }
    const liveUser = getLiveFirebaseUser();
    if (!liveUser?.uid) {
      return null;
    }
    return {
      uid: liveUser.uid,
      email: liveUser.email || user?.email || ""
    };
  }

  function redirectIfNotLoggedIn() {
    try {
      if (window.top && window.top !== window) {
        window.top.location.replace(notLoggedInRedirectUrl);
        return;
      }
    } catch {}
    window.location.replace(notLoggedInRedirectUrl);
  }

  async function handleClick() {
    const productId = toProductId(params.get("product_id"));
    const qty = toQty(params.get("qty"));
    const okText = String(params.get("ok_text") || "Added to cart successfully").trim();
    const okBtnText = String(params.get("ok_btn_text") || "Added").trim();
    const okHoldMs = parseHoldMs(params.get("ok_hold_ms"), 1800);
    const errText = String(params.get("err_text") || "Failed to add to cart").trim();
    const errBtnText = String(params.get("err_btn_text") || "Failed").trim();
    const errHoldMs = parseHoldMs(params.get("err_hold_ms"), 2200);

    if (!productId) {
      if (isCompact) {
        setTimedButtonState("err", "Invalid link", button.textContent, errHoldMs);
      } else {
        setMessage("Missing product reference.", "err");
      }
      return;
    }
    if (!appDb || !appDb.isConfigured()) {
      if (isCompact) {
        setTimedButtonState("err", "Unavailable", button.textContent, errHoldMs);
      } else {
        setMessage("Cart service is unavailable", "err");
      }
      return;
    }

    button.disabled = true;
    const previousLabel = button.textContent;
    let deferLabelRestore = false;
    if (restoreTimer) {
      clearTimeout(restoreTimer);
      restoreTimer = null;
    }
    button.classList.remove("is-added", "is-error");
    button.textContent = "Adding...";
    setMessage("", "");

    try {
      const user = await resolveUser();
      if (!user?.uid) {
        redirectIfNotLoggedIn();
        return;
      }

      const persistCart = async () => {
        let finalQty = qty;
        if (typeof appDb.addCartItem === "function") {
          const item = await appDb.addCartItem(user.uid, productId, qty, {
            contactEmail: user.email || ""
          });
          if (item?.quantity) {
            finalQty = Math.max(1, Number(item.quantity) || qty);
          }
          return finalQty;
        }
        if (typeof appDb.setCart === "function") {
          const cart = typeof appDb.getCart === "function" ? await appDb.getCart(user.uid) : null;
          const currentQty = cart && Number(cart.productId) === productId
            ? Math.max(1, Number(cart.quantity) || 1)
            : 0;
          finalQty = Math.max(1, currentQty + qty);
          await appDb.setCart(user.uid, {
            productId,
            quantity: finalQty,
            contactEmail: user.email || ""
          });
          return finalQty;
        }
        throw new Error("cart_api_missing");
      };

      const finalQty = await runWithRetry(
        persistCart,
        (retryCount, maxRetry) => {
          button.textContent = `Retrying... (${retryCount}/${maxRetry})`;
          if (!isCompact) {
            setMessage(`Network issue. Retrying ${retryCount}/${maxRetry}...`, "info");
          }
        }
      );

      saveLocalCart(productId, finalQty);
      deferLabelRestore = true;
      setTimedButtonState("ok", okBtnText, previousLabel, okHoldMs);
      if (!isCompact) {
        setMessage(okText, "ok");
      }
    } catch (error) {
      console.error("add-to-cart-button: add failed", error);
      const mapped = classifyAddError(error, {
        message: errText,
        buttonText: errBtnText
      });
      if (isCompact) {
        deferLabelRestore = true;
        setTimedButtonState("err", mapped.buttonText, previousLabel, errHoldMs);
      } else {
        setMessage(mapped.message, "err");
      }
      if (mapped.redirect) {
        setTimeout(() => {
          redirectIfNotLoggedIn();
        }, 300);
      }
    } finally {
      if (!deferLabelRestore) {
        button.classList.remove("is-added", "is-error");
        button.textContent = previousLabel;
      }
      button.disabled = false;
    }
  }

  applyButtonOptions();
  button.addEventListener("click", () => {
    handleClick().catch((error) => {
      console.error("add-to-cart-button click failed", error);
      if (isCompact) {
        setTimedButtonState("err", "Failed", button.textContent, 2200);
      } else {
        setMessage("Unexpected error", "err");
      }
    });
  });
})();
</script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="icons.js?v=20260304icons1"></script>
</body>
</html>
