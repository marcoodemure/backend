<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>
<link rel="stylesheet" href="style.css?v=20260306profile1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
</head>
<body>

<div class="profile-page">
  <div class="profile-head-card">
    <div class="profile-head-copy">
      <p class="profile-kicker">Account Settings</p>
      <h1 data-ui-icon="user-round">Customer Profile</h1>
      <p>Save details once so checkout is faster and less confusing.</p>
    </div>
    <div class="user-panel profile-user-panel" id="profileUserPanel"></div>
  </div>

  <div id="profileFeedback" class="page-feedback hidden"></div>

  <form id="profileForm" class="profile-form" autocomplete="off">
    <section class="profile-section">
      <div class="profile-section-head">
        <h2 data-ui-icon="id-card">Contact Details</h2>
        <span>Used for order updates</span>
      </div>
      <div class="profile-grid profile-grid-2">
        <label class="profile-field" for="profileFirstName">
          <span>First name <em>Required</em></span>
          <input id="profileFirstName" type="text" placeholder="First name" autocomplete="given-name">
        </label>
        <label class="profile-field" for="profileLastName">
          <span>Last name <em>Required</em></span>
          <input id="profileLastName" type="text" placeholder="Last name" autocomplete="family-name">
        </label>
        <label class="profile-field" for="profilePhone">
          <span>Phone <em>Required</em></span>
          <input id="profilePhone" type="text" placeholder="Phone" autocomplete="tel">
        </label>
      </div>
    </section>

    <section class="profile-section">
      <div class="profile-section-head">
        <h2 data-ui-icon="map-pinned">Saved Address</h2>
        <span>Auto-fills shipping in checkout</span>
      </div>
      <div class="profile-grid profile-grid-2">
        <label class="profile-field" for="profileCountry">
          <span>Country <em>Required</em></span>
          <input id="profileCountry" type="text" placeholder="Country" autocomplete="country-name">
        </label>
        <label class="profile-field" for="profileCity">
          <span>City <em>Required</em></span>
          <input id="profileCity" type="text" placeholder="City" autocomplete="address-level2">
        </label>
        <label class="profile-field" for="profileProvince">
          <span>Province <em>Required</em></span>
          <input id="profileProvince" type="text" placeholder="Province" autocomplete="address-level1">
        </label>
        <label class="profile-field" for="profilePostalCode">
          <span>Postal code <em>Required</em></span>
          <input id="profilePostalCode" type="text" placeholder="Postal code" autocomplete="postal-code">
        </label>
        <label class="profile-field profile-field-full" for="profileAddress1">
          <span>Address line 1 <em>Required</em></span>
          <input id="profileAddress1" type="text" placeholder="House number, street" autocomplete="address-line1">
        </label>
        <label class="profile-field profile-field-full" for="profileAddress2">
          <span>Address line 2 <em>Optional</em></span>
          <input id="profileAddress2" type="text" placeholder="Apartment, suite, landmark" autocomplete="address-line2">
        </label>
      </div>
    </section>

    <section class="profile-section">
      <div class="address-map-card profile-map-card">
        <div class="address-map-head">
          <h3 data-ui-icon="map-pinned">Map Address Picker</h3>
          <button id="profileLocateBtn" type="button" data-ui-icon="locate-fixed">Locate Typed Address</button>
        </div>
        <p id="profileMapHint" class="address-map-hint">Click the map to refine your saved location.</p>
        <div id="profileMapPreview" class="address-map-preview"></div>
      </div>
    </section>

    <div class="profile-actions">
      <button id="saveProfileBtn" type="submit" data-ui-icon="save">Save Profile</button>
      <a href="orders.html" class="profile-link-btn" data-ui-icon="package">View Orders</a>
      <a href="cart.html" class="profile-link-btn" data-ui-icon="shopping-cart">Go to Cart</a>
    </div>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="firebase-config.js"></script>
<script src="auth-service.js"></script>
<script src="firebase-auth-helpers.js"></script>
<script src="firebase-db.js"></script>
<script src="profile.js?v=20260305ux1"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="icons.js?v=20260304icons1"></script>
  <script src="iframe-auto-height.js?v=20260306a"></script>
</body>
</html>
