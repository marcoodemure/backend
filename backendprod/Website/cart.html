<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Cart</title>
<link rel="stylesheet" href="style.css?v=20260306multi1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  body {
    background: #ffffff;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .cart-page {
    background: #ffffff;
    backdrop-filter: none;
    border: 1px solid #e5e7eb;
    border-radius: 20px;
    box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
    margin-top: 24px;
    padding: 20px;
  }

  .cart-header h1 {
    font-size: clamp(1.8rem, 2.6vw, 2.4rem);
    letter-spacing: -0.03em;
    margin: 0;
    color: #0f172a;
  }

  .cart-toolbar {
    border: 1px solid #e5e7eb;
    background: #ffffff;
  }

  .cart-toolbar-actions button {
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 999px;
    padding: 9px 14px;
    transition: all 0.2s ease;
  }

  .cart-toolbar-actions button:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 18px rgba(15, 23, 42, 0.1);
  }

  .cart-toolbar-actions #cartCheckoutSelectedBtn {
    background: #0f172a;
    color: #ffffff;
    border-color: #0f172a;
  }

  .cart-item {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    box-shadow: 0 10px 22px rgba(15, 23, 42, 0.07);
  }

  .cart-item-enter {
    opacity: 0;
    transform: translateY(8px);
    animation: cartItemEnter 0.32s ease forwards;
    animation-delay: calc(var(--cart-item-index, 0) * 0.045s);
  }

  .cart-loading-list {
    display: grid;
    gap: 10px;
  }

  @keyframes cartItemEnter {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .cart-item:hover {
    border-color: #d1d5db;
    box-shadow: 0 12px 24px rgba(15, 23, 42, 0.1);
  }

  .cart-item-check input[type="checkbox"],
  .cart-select-all input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: #0f172a;
    cursor: pointer;
  }

  .cart-item-name {
    color: #0f172a;
  }

  .cart-item-meta {
    color: #334155;
  }

  .cart-item-price {
    color: #111827;
  }

  .cart-remove-btn {
    border-radius: 999px;
    padding: 7px 12px;
  }

  .qty-control.compact button {
    border-radius: 999px;
    width: 32px;
    height: 32px;
    font-weight: 800;
    border-color: #cbd5e1;
  }

  .cart-empty {
    border-radius: 18px;
    border: 1px dashed #d1d5db;
    background: #ffffff;
  }

  @media (max-width: 1024px) {
    .cart-page {
      margin-top: 16px;
      border-radius: 16px;
      padding: 16px;
    }
  }

  @media (max-width: 768px) {
    .cart-page {
      margin-top: 12px;
      border-radius: 14px;
      padding: 12px;
    }

    .cart-toolbar-actions button {
      width: 100%;
      border-radius: 12px;
    }

    .cart-item:hover {
      box-shadow: 0 10px 18px rgba(15, 23, 42, 0.08);
    }
  }

  @media (max-width: 520px) {
    .cart-page {
      margin-top: 0;
      padding: 10px;
      border-radius: 12px;
      border-left: none;
      border-right: none;
      box-shadow: none;
    }

    .cart-header h1 {
      font-size: clamp(1.45rem, 7vw, 1.9rem);
    }
  }
</style>
</head>
<body>

<div class="cart-page">
  <div class="cart-header">
    <h1 data-ui-icon="shopping-cart">Your Cart</h1>
    <div id="cartUserPanel" class="user-panel"></div>
  </div>

  <div id="cartFeedback" class="page-feedback hidden"></div>

  <div id="cartToolbar" class="cart-toolbar hidden">
    <label class="cart-select-all" data-ui-icon="check">
      <input id="cartSelectAll" type="checkbox">
      Select all
    </label>
    <div class="cart-toolbar-actions">
      <button id="cartCheckoutSelectedBtn" type="button" data-ui-icon="badge-check">Checkout selected</button>
      <button id="cartRemoveSelectedBtn" type="button" class="danger" data-ui-icon="trash-2">Remove selected</button>
    </div>
  </div>

  <div id="cartList" class="cart-list"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=20260302cart3"></script>
<script src="auth-service.js?v=20260302cart3"></script>
<script src="firebase-auth-helpers.js?v=20260302cart3"></script>
<script src="firebase-db.js?v=20260302cart3"></script>
<script src="cart.js?v=20260306multi1"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="icons.js?v=20260304icons1"></script>
  <script src="iframe-auto-height.js?v=20260306a"></script>
</body>
</html>
