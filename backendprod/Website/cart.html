<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Cart</title>
<link rel="stylesheet" href="style.css?v=20260302cart3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  body {
    background:
      radial-gradient(1200px 500px at 8% -20%, rgba(30, 64, 175, 0.12), transparent 60%),
      radial-gradient(900px 480px at 95% -10%, rgba(13, 148, 136, 0.12), transparent 62%),
      #eef2ff;
    min-height: 100vh;
  }

  .cart-page {
    background: rgba(255, 255, 255, 0.76);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(148, 163, 184, 0.26);
    border-radius: 20px;
    box-shadow: 0 24px 44px rgba(15, 23, 42, 0.12);
    margin-top: 24px;
    padding: 20px;
  }

  .cart-header h1 {
    font-size: clamp(1.8rem, 2.6vw, 2.4rem);
    letter-spacing: -0.03em;
    margin: 0;
    color: #0f172a;
  }

  .cart-toolbar {
    border: 1px solid #c7d2fe;
    background: linear-gradient(135deg, #ffffff 0%, #eef2ff 100%);
  }

  .cart-toolbar-actions button {
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 999px;
    padding: 9px 14px;
    transition: all 0.2s ease;
  }

  .cart-toolbar-actions button:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(30, 64, 175, 0.16);
  }

  .cart-toolbar-actions #cartCheckoutSelectedBtn {
    background: #0f172a;
    color: #ffffff;
    border-color: #0f172a;
  }

  .cart-item {
    background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
    border: 1px solid #dbe3f3;
    box-shadow: 0 10px 22px rgba(15, 23, 42, 0.07);
  }

  .cart-item:hover {
    border-color: #93c5fd;
    box-shadow: 0 14px 28px rgba(30, 64, 175, 0.14);
  }

  .cart-item-check input[type="checkbox"],
  .cart-select-all input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: #0f172a;
    cursor: pointer;
  }

  .cart-item-name {
    color: #0f172a;
  }

  .cart-item-meta {
    color: #334155;
  }

  .cart-item-price {
    color: #1d4ed8;
  }

  .cart-remove-btn {
    border-radius: 999px;
    padding: 7px 12px;
  }

  .qty-control.compact button {
    border-radius: 999px;
    width: 32px;
    height: 32px;
    font-weight: 800;
    border-color: #cbd5e1;
  }

  .cart-empty {
    border-radius: 18px;
    border: 1px dashed #94a3b8;
    background: linear-gradient(180deg, #ffffff 0%, #eff6ff 100%);
  }
</style>
</head>
<body>

<div class="cart-page">
  <div class="cart-header">
    <h1>Your Cart</h1>
    <div id="cartUserPanel" class="user-panel"></div>
  </div>

  <div id="cartFeedback" class="page-feedback hidden"></div>

  <div id="cartToolbar" class="cart-toolbar hidden">
    <label class="cart-select-all">
      <input id="cartSelectAll" type="checkbox">
      Select all
    </label>
    <div class="cart-toolbar-actions">
      <button id="cartCheckoutSelectedBtn" type="button">Checkout selected</button>
      <button id="cartRemoveSelectedBtn" type="button" class="danger">Remove selected</button>
    </div>
  </div>

  <div id="cartList" class="cart-list"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=20260302cart3"></script>
<script src="auth-service.js?v=20260302cart3"></script>
<script src="firebase-auth-helpers.js?v=20260302cart3"></script>
<script src="firebase-db.js?v=20260302cart3"></script>
<script src="cart.js?v=20260302cart4"></script>
</body>
</html>
