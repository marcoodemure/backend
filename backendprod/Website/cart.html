<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

<div class="cart-page">
  <div class="cart-header">
    <h1>Your Cart</h1>
    <div id="cartUserPanel" class="user-panel"></div>
  </div>

  <div id="cartFeedback" class="page-feedback hidden"></div>

  <div id="cartToolbar" class="cart-toolbar hidden">
    <label class="cart-select-all">
      <input id="cartSelectAll" type="checkbox">
      Select all
    </label>
    <div class="cart-toolbar-actions">
      <button id="cartCheckoutSelectedBtn" type="button">Checkout selected</button>
      <button id="cartRemoveSelectedBtn" type="button" class="danger">Remove selected</button>
    </div>
  </div>

  <div id="cartList" class="cart-list"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth-service.js"></script>
<script src="firebase-auth-helpers.js"></script>
<script src="firebase-db.js"></script>
<script src="cart.js"></script>
</body>
</html>
