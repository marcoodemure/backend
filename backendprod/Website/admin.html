<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Admin Dashboard</title>
<link rel="stylesheet" href="style.css?v=20260303responsive1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

<div class="admin-page" id="adminPage">
  <div class="admin-header">
    <h1>Admin Sign In</h1>
  </div>

  <div id="adminLoginWall" class="admin-login-wall">
    <div class="admin-login-card">
      <h2>Admin Sign In</h2>
      <p>Enter credentials to access the dashboard.</p>

      <form id="adminLoginForm" class="admin-login-form" autocomplete="off">
        <input id="adminEmailInput" type="email" placeholder="Admin email (username)" required>
        <input id="adminPasswordInput" type="password" placeholder="Password" required>
        <button id="adminLoginBtn" type="submit">Sign In</button>
      </form>

      <p id="adminLoginError" class="admin-login-error hidden"></p>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth-service.js"></script>
<script src="firebase-auth-helpers.js"></script>
<script src="firebase-db.js"></script>
<script src="admin-login.js"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="icons.js?v=20260304icons1"></script>
</body>
</html>
