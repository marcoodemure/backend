<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add To Cart</title>
</head>
<body>
<p id="addCartStatus" style="font-family:Inter,sans-serif;padding:16px;">Adding item to cart...</p>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth-service.js"></script>
<script src="firebase-auth-helpers.js"></script>
<script src="firebase-db.js"></script>
<script>
(async function () {
  const statusEl = document.getElementById("addCartStatus");
  const params = new URLSearchParams(window.location.search);
  const auth = window.authService;
  const appDb = window.appDb;
  const notLoggedInRedirectUrl = "https://sites.google.com/view/habitlikha/home/profile";

  function toProductId(value) {
    const id = Number(value);
    return Number.isFinite(id) && id > 0 ? Math.floor(id) : 0;
  }

  function toQty(value) {
    const qty = Number(value);
    return Number.isFinite(qty) && qty > 0 ? Math.max(1, Math.floor(qty)) : 1;
  }

  function normalizeNext(raw) {
    const value = String(raw || "").trim();
    if (!value) return "cart.html";
    if (value === "cart") return "cart.html";
    if (value === "checkout") return "checkout.html";
    if (/^[A-Za-z0-9._-]+\.html(?:\?.*)?$/i.test(value)) {
      return value;
    }
    return "cart.html";
  }

  function redirectUrl(nextPage, productId) {
    if (/^checkout\.html(?:\?|$)/i.test(nextPage) && !/[?&]product_id=/.test(nextPage)) {
      const joiner = nextPage.includes("?") ? "&" : "?";
      return `${nextPage}${joiner}product_id=${encodeURIComponent(String(productId))}`;
    }
    return nextPage;
  }

  function saveLocalCart(productId, quantity) {
    try {
      localStorage.setItem("cartProductId", String(productId));
      localStorage.setItem("cartQuantity", String(Math.max(1, Number(quantity) || 1)));
    } catch {}
  }

  const productId = toProductId(params.get("product_id"));
  const qtyToAdd = toQty(params.get("qty"));
  const nextPage = normalizeNext(params.get("next"));

  if (!productId) {
    window.location.replace("cart.html");
    return;
  }

  let user = null;
  if (auth && typeof auth.getCurrentUser === "function") {
    user = auth.getCurrentUser();
  }
  if (!user?.uid && auth && typeof auth.waitForAuthState === "function") {
    user = await auth.waitForAuthState(4500);
  }

  if (!user?.uid) {
    try {
      if (window.top && window.top !== window) {
        window.top.location.replace(notLoggedInRedirectUrl);
        return;
      }
    } catch {}
    window.location.replace(notLoggedInRedirectUrl);
    return;
  }

  let currentQty = 0;
  let shippingOption = "standard_shipping";
  let paymentMethod = "cash_on_delivery";
  let deliveryMethod = "ship";
  let orderNotes = "";
  let shippingLocation = null;
  let shippingLocationSnapshot = null;
  let shippingLocationConfirmed = false;

  if (appDb && appDb.isConfigured() && typeof appDb.getCart === "function") {
    try {
      const currentCart = await appDb.getCart(user.uid);
      if (currentCart && Number(currentCart.productId) === productId) {
        currentQty = Math.max(1, Number(currentCart.quantity) || 1);
      }
      if (currentCart?.shippingOption) {
        shippingOption = currentCart.shippingOption;
      }
      if (currentCart?.paymentMethod) {
        paymentMethod = currentCart.paymentMethod;
      }
      if (currentCart?.deliveryMethod) {
        deliveryMethod = currentCart.deliveryMethod === "pickup" ? "pickup" : "ship";
      }
      if (typeof currentCart?.orderNotes === "string") {
        orderNotes = currentCart.orderNotes;
      }
      if (
        currentCart?.shippingLocation
        && Number.isFinite(Number(currentCart.shippingLocation.lng))
        && Number.isFinite(Number(currentCart.shippingLocation.lat))
      ) {
        shippingLocation = {
          lng: Number(currentCart.shippingLocation.lng),
          lat: Number(currentCart.shippingLocation.lat)
        };
      }
      if (currentCart?.shippingLocationSnapshot?.mapUrl) {
        shippingLocationSnapshot = {
          embedUrl: String(currentCart.shippingLocationSnapshot.embedUrl || currentCart.shippingLocationSnapshot.imageUrl || ""),
          imageUrl: String(currentCart.shippingLocationSnapshot.imageUrl || ""),
          mapUrl: String(currentCart.shippingLocationSnapshot.mapUrl || "")
        };
      }
      shippingLocationConfirmed = Boolean(currentCart?.shippingLocationConfirmed);
    } catch (error) {
      console.error("add-to-cart.html: Failed to read current cart", error);
    }
  }

  const nextQty = Math.max(1, currentQty + qtyToAdd);
  let product = null;
  if (appDb && appDb.isConfigured() && typeof appDb.getProductById === "function") {
    try {
      product = await appDb.getProductById(productId);
    } catch (error) {
      console.error("add-to-cart.html: Failed to load product details", error);
    }
  }

  const draft = {
    productId,
    productName: product?.name || `Product #${productId}`,
    productSize: product?.size || "N/A",
    productImage: product?.image || "",
    quantity: nextQty,
    unitPrice: Number(product?.price) || 0,
    shippingOption,
    paymentMethod,
    deliveryMethod,
    orderNotes,
    contactEmail: user.email || "",
    shippingLocation,
    shippingLocationSnapshot,
    shippingLocationConfirmed
  };

  if (appDb && appDb.isConfigured() && typeof appDb.setCart === "function") {
    try {
      await appDb.setCart(user.uid, draft);
    } catch (error) {
      console.error("add-to-cart.html: Failed to persist cart", error);
      statusEl.textContent = "Failed to save cart. Redirecting...";
    }
  }

  saveLocalCart(productId, nextQty);
  window.location.replace(redirectUrl(nextPage, productId));
})();
</script>
</body>
</html>
